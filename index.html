lor":"#a8b8a0","more":"Personlighet: Den mjuka drömmaren med ett varmt hjärta.\n\nBianca är den omtänksamma och eftertänksamma figuren som alltid ser det fina i andra. Hon uppskattar lugna stunder, vänlighet och små detaljer som gör vardagen lite vackrare. Hon är kanske inte den som tar mest plats, men hon har en alldeles särskild förmåga att sprida värme omkring sig.\n\nDess superkraft: Biancas former och detaljer ger fingrarna något att känna och utforska. Hon påminner dig om att vara varsam med dig själv och att du också förtjänar samma omtanke som du ger till andra.\n\nBiancas lilla påminnelse: Glöm inte att ge dig själv lite kärlek också.","cat":"friends","imgs":[]},{"id":"p1","name":"Coco – Apan med spiralsvansen","desc":"Coco är den nyfikna apan med en alldeles speciell detalj – sin taktila spiralsvans. Hon älskar att upptäcka nya saker och kombinerar lekfull design med en spännande känsla att utforska.","price":49,"img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAACMaADAAQAAAABAAACvAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgCvAIxAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscEVUtHwJDNicoIJChYXGBkaJSYnKCkqNDU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6g4SFhoeIiYqSk5SVlpeYmZqio6Slpqeoqaqys7S1tre4ubrCw8TFxsfIycrS09TV1tfY2drh4uPk5ebn6Onq8fLz9PX29/j5+v/EAB8BAAMBAQEBAQEBAQEAAAAAAAABAgMEBQYHCAkKC//EALURAAIBAgQEAwQHBQQEAAECdwABAgMRBAUhMQYSQVEHYXETIjKBCBRCkaGxwQkjM1LwFWJy0QoWJDThJfEXGBkaJicoKSo1Njc4OTpDREVGR0hJSlNUVVZXWFlaY2RlZmdoaWpzdHV2d3h5eoKDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAgICAgICAwICAwQDAwMEBQQEBAQFBgUFBQUFBggGBgYGBgYICAgICAgICAkJCQkJCQsLCwsLDAwMDAwMDAwMDP/bAEMBAgICAwMDBQMDBQwIBwgMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDP/dAAQAJP/aAAwDAQACEQMRAD8A/WOFcY9xVsIfSs   if(!new RegExp('^['+L+' .\'-]{2,}\\s\\d+\\s?['+L+']?(\\s?(lgh|/)?\\s?\\d+)?$').test(v('ad')))return['ad','Skriv gatuadress med nummer, t.ex. Storgatan 12'];
  if(!/^[1-9]\d{2}\s?\d{2}$/.test(v('zp')))return['zp','Postnumret ska vara 5 siffror'];
  if(!new RegExp('^['+L+' .\'-]{2,}$').test(v('ty')))return['ty','Skriv en giltig ort'];
  return null}

function order(){

  const body='Beställning '+ref+' från '+n+'\nTelefon: '+v('ph')+'\nE-post: '+v('em')+'\nAdress: '+v('ad')+', '+v('zp')+' '+v('ty')+(v('mg')?'\nMeddelande: '+v('mg'):'')+'\n\n'+cart.map(line).join('\n')+'\n\nVaror: '+kr(sub())+'\nFrakt: '+(codeOk()?'0 kr – rabattkod "'+S.code+'" använd, PERSONLIG ÖVERLÄMNING':kr(ship())+' – SKICKAS MED POST')+'\nTotalt: '+kr(total())+'\nKunden har bekräftat att Swish är skickad.\nBetalning: Swish till '+S.swish+', märkt "Stone & Soul '+ref+'"';

async function send(body){
  const v=k=>$('#'+k).value.trim(),b=$('#ob');
  const net=location.hostname&&!/claude|anthropic|localhost/.test(location.hostname);
  if(net){
    b.textContent='Skickar…';b.onclick=null;
    const f={'form-name':'bestallning',ref,name:v('nm'),phone:v('ph'),email:v('em'),address:v('ad'),zip:v('zp'),city:v('ty'),message:v('mg'),total:String(total()),order:body};
    try{
      const r=await fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(f).toString()});
      if(r.ok){cart=[];saveCart();ref='';render();$('#ov').innerHTML=`<div class="sheet"><h2 style="margin:0">Tack för din beställning! ♡</h2><p class="sub">Vi har fått den och hör av oss så snart vi sett din Swish-betalning.</p><button class="btn" onclick="closeO()">Stäng</button></div>`;$('#ov').classList.add('on');return}
    }catch(e){}
  }
  done(body)
}

}
